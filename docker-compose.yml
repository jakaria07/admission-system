services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: admission-postgres
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admission_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-admission_db}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admission-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=admission_db;Username=postgres;Password=postgres}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      MAX_POOL_SIZE: ${MAX_POOL_SIZE:-35}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admission-api-2
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: ${DATABASE_CONNECTION_STRING:-Host=postgres;Port=5432;Database=admission_db;Username=postgres;Password=postgres}
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      MAX_POOL_SIZE: ${MAX_POOL_SIZE:-35}
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: admission-frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api
    restart: unless-stopped

  tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: admission-tests
    profiles:
      - test
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    environment:
      TEST_CONNECTION_STRING: Host=postgres;Port=5432;Database=admission_db;Username=postgres;Password=postgres;Maximum Pool Size=25
      MAX_POOL_SIZE: 25
      E2E_API_URLS: http://api:8080,http://api-2:8080
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      api-2:
        condition: service_healthy
    command: ["dotnet", "test", "--logger", "console;verbosity=normal"]

volumes:
  pgdata:
